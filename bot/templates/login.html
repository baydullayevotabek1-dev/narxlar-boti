<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narxlar Paneli — Kirish</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
  h1 { font-size: 22px; margin-bottom: 6px; color: #333; }
  .sub { color: #888; margin-bottom: 30px; font-size: 14px; }
  input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; }
  input:focus { outline: none; border-color: #667eea; }
  button { width: 100%; padding: 14px; margin-top: 16px; background: #667eea; color: #fff; border: none;
           border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #5568d3; }
  .err { color: #e74c3c; margin-bottom: 12px; font-size: 14px; background: #fce4e4; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Narxlar Paneli</h1>
  <p class="sub">MUS menejerlari uchun</p>
  {{ERROR}}
  <form method="POST" action="/login">
    <input type="password" name="password" placeholder="Parol" required autofocus>
    <button type="submit">Kirish</button>
  </form>
</div>
</body>
</html>
